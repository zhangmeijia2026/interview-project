# 模板：复制为 application-local.yml 并填入你的密钥（本文件可提交）。
# 不要在此文件写真实密码/Key。
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/interview_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD:change-me}
  data:
    redis:
      host: localhost
      port: 6379
  ai:
    openai:
      # 真实 DeepSeek 密钥：从 https://platform.deepseek.com 获取，用环境变量注入，勿写死在提交文件里
      api-key: ${DEEPSEEK_API_KEY:}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFGH}
  upload-dir: ./uploads
  verify-code: "123456"

ai:
  mock-enabled: true   # true=离线引擎（无 key 也可全链路演示/CI）；false=真实 DeepSeek（需配置 DEEPSEEK_API_KEY 且网络可达）
